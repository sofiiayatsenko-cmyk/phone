<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --berry:#0b3a8a;
    --hot:#1565e0;
    --hot-soft:#93bdf3;
    --bg1:#b9d5fb;
    --bg2:#e8f1fe;
    --field:#f2f2f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    color:#1d1d1f;
    display:flex;justify-content:center;
  }
  .app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden}

  /* ---------- Scrolling grid ---------- */
  h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 12px}
  .col{position:relative}
  /* ---------- Match: gold outline + link ---------- */
  .card{position:relative}
  .card.gold{box-shadow:0 0 0 3px #f3cf6b, 0 0 26px 6px rgba(243,200,90,.65);animation:goldpulse .9s ease-in-out infinite alternate}
  .card.gold::after{
    content:"";position:absolute;inset:0;border-radius:22px;padding:3px;pointer-events:none;
    background:linear-gradient(135deg,#fff3c4,#e2b043 30%,#fff7d6 50%,#c8922a 75%,#ffe9a3);
    background-size:200% 200%;animation:shine 1.4s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  }
  @keyframes goldpulse{to{box-shadow:0 0 0 3px #ffe08a, 0 0 38px 12px rgba(243,200,90,.8)}}
  @keyframes shine{to{background-position:200% 200%}}
  .link{
    position:absolute;z-index:5;height:6px;border-radius:3px;pointer-events:none;
    background:linear-gradient(90deg,#e2b043,#fff3c4,#e2b043);
    box-shadow:0 0 14px 4px rgba(243,200,90,.8);transform:scaleX(0);transition:transform .35s ease-out;
  }
  .link.on{transform:scaleX(1)}
  .clone{position:absolute;z-index:30;margin:0;pointer-events:none;transition:none}
  .clone.bare{background:transparent;box-shadow:none;animation:none;transition:background .4s,box-shadow .4s}
  .clone.bare::after,.clone.bare b{opacity:0;transition:opacity .3s}
  .clone .photo{filter:drop-shadow(0 0 12px rgba(243,200,90,.9))}
  .flash{
    position:absolute;z-index:31;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,244,200,.95) 0%,rgba(243,200,90,.6) 35%,rgba(243,200,90,0) 70%);
    animation:flash .8s ease-out forwards;
  }
  @keyframes flash{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
  .hero.ghost{opacity:0;transition:none}
  .hero.golden .photo{filter:drop-shadow(0 0 16px rgba(243,200,90,.85)) drop-shadow(0 18px 24px rgba(10,40,100,.2))}
  .overlay.merge .hero{top:14%;width:76%}
  .overlay.merge .close{opacity:0;pointer-events:none}
  .next.pulse{animation:npulse 1s ease-in-out infinite}
  @keyframes npulse{50%{transform:scale(1.03);box-shadow:0 0 0 8px rgba(21,101,224,.18)}}
  .track{display:flex;flex-direction:column;gap:14px;will-change:transform}
  .col:nth-child(1) .track{animation:up 30s linear infinite}
  .col:nth-child(2) .track{animation:down 30s linear infinite}
  @keyframes up{from{transform:translateY(0)}to{transform:translateY(calc(-50% - 7px))}}
  @keyframes down{from{transform:translateY(calc(-50% - 7px))}to{transform:translateY(0)}}
  .card{
    background:#fff;border-radius:22px;padding:14px 10px 16px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;box-shadow:0 6px 18px rgba(20,70,160,.10);
    transition:transform .2s ease;
  }
  .card:active{transform:scale(.96)}
  .card svg{width:100%;height:auto;display:block}
  .photo{width:100%;aspect-ratio:200/190;object-fit:contain;display:block}
  .hero .photo{filter:drop-shadow(0 18px 24px rgba(10,40,100,.20))}
  .sheet input.typing{border-color:var(--berry);background:#fff}
  .card b{color:var(--berry);font-weight:600;font-size:15px}

  /* ---------- Overlay ---------- */
  .overlay{
    position:absolute;inset:0;z-index:10;
    background:rgba(214,230,253,.55);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .35s ease, background .6s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .overlay.done{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
  .close{
    position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
    background:#fff;border:0;display:grid;place-items:center;cursor:pointer;z-index:5;
    box-shadow:0 4px 14px rgba(0,0,0,.08);transition:opacity .3s;
  }
  .overlay.ship .close,.overlay.done .close{opacity:0;pointer-events:none}

  .hero{
    position:absolute;left:50%;top:12%;width:88%;
    transform:translateX(-50%);
    transition:all .6s cubic-bezier(.2,.8,.2,1);
  }
  .hero svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 24px rgba(10,40,100,.20))}
  .overlay.form .hero{top:2%;width:52%}
  .overlay.ship .hero{top:22%;width:70%}
  .hero.into-box{transform:translateX(-50%) translateY(120px) scale(.25);opacity:0;transition:all .7s cubic-bezier(.5,0,.7,.4)}

  /* color picker */
  .picker{
    position:absolute;left:0;right:0;top:68%;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    transition:opacity .3s, transform .3s;
  }
  .overlay:not(.pick) .picker{opacity:0;pointer-events:none;transform:translateY(20px)}
  .swatches{display:flex;gap:12px;align-items:center}
  .sw{
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s;
  }
  .sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--hot)}
  .sw:active{transform:scale(.92)}
  .ok{
    width:50px;height:50px;border-radius:50%;border:0;background:var(--hot);cursor:pointer;
    display:grid;place-items:center;margin-left:6px;box-shadow:0 6px 16px rgba(21,101,224,.35);
  }
  .cname{font-size:15px;font-weight:500;color:#444}

  /* form sheet */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;top:42%;
    background:#fff;border-radius:26px 26px 0 0;padding:22px 18px 26px;
    display:flex;flex-direction:column;gap:6px;
    transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.form .sheet{transform:translateY(0)}
  .sheet .sel{font-size:15px;font-weight:500;color:#333;margin-bottom:10px}
  .sheet label{font-size:15px;font-weight:500;color:#222;margin-top:8px}
  .sheet input{
    width:100%;height:54px;border-radius:14px;border:2px solid transparent;
    background:var(--field);padding:0 16px;font:500 16px 'Outfit',sans-serif;color:#111;outline:none;
    transition:border-color .2s, background .2s;
  }
  .sheet input::placeholder{color:#8a8a8f;font-weight:400}
  .sheet input:focus{border-color:var(--berry);background:#fff}
  .next{
    margin-top:auto;height:56px;border-radius:28px;border:0;cursor:pointer;
    background:var(--hot-soft);color:#fff;font:600 17px 'Outfit',sans-serif;
    transition:background .25s, transform .15s;
  }
  .next.ready{background:var(--hot)}
  .next:active{transform:scale(.98)}

  /* delivery */
  .stage{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
  .box,.circle,.done-wrap{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .box{width:190px;opacity:0;transform:translate(-50%,-30%) scale(.6);transition:all .5s cubic-bezier(.3,1.4,.5,1)}
  .box.show{opacity:1;transform:translate(-50%,-30%) scale(1)}
  .box.shrink{opacity:0;transform:translate(-50%,-50%) scale(.3);transition:all .45s ease-in}
  .circle{
    width:200px;height:200px;border-radius:50%;background:#fff;overflow:hidden;
    box-shadow:0 14px 40px rgba(20,70,160,.16);
    opacity:0;transform:translate(-50%,-50%) scale(.2);transition:all .45s cubic-bezier(.3,1.4,.5,1);
  }
  .circle.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .circle.hide{opacity:0;transform:translate(-50%,-50%) scale(.4);transition:all .4s ease-in}
  .road{position:absolute;left:0;right:0;top:139px;height:2px;
    background:repeating-linear-gradient(90deg,#d9d9de 0 22px,transparent 22px 34px)}
  .truck{position:absolute;top:44px;left:-150px;width:140px}
  .truck.in{animation:drivein 1s cubic-bezier(.2,.7,.3,1) forwards}
  .truck.out{animation:driveout .8s cubic-bezier(.6,0,.9,.5) forwards}
  @keyframes drivein{from{left:-150px}to{left:30px}}
  @keyframes driveout{from{left:30px}to{left:230px}}
  .truck .wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .truck .bob{animation:bob .3s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-1.5px)}}

  .done-wrap{display:flex;flex-direction:column;align-items:center;width:300px;transform:translate(-50%,-62px);pointer-events:none}
  .check{
    width:124px;height:124px;border-radius:50%;background:#34c759;display:grid;place-items:center;position:relative;
    transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1);
  }
  .check.show{transform:scale(1)}
  .check::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(52,199,89,.35);opacity:0}
  .check.show::before{animation:ring 1.8s ease-out .3s infinite}
  @keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
  .check path{stroke-dasharray:80;stroke-dashoffset:80;transition:stroke-dashoffset .45s ease .25s}
  .check.show path{stroke-dashoffset:0}
  .done-txt{margin-top:22px;text-align:center;opacity:0;transform:translateY(8px);transition:all .4s ease .45s}
  .done-txt.show{opacity:1;transform:none}
  .done-txt h2{font-size:22px;font-weight:700}
  .done-txt p{font-size:15px;color:#555;margin-top:2px}
  .confetti{position:absolute;left:0;top:-62px;width:0;height:0}
  .confetti i{position:absolute;width:8px;height:5px;border-radius:1.5px;opacity:0}
  .confetti i.go{animation:burst 1.4s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes burst{
    0%{opacity:1;transform:translate(0,0) rotate(0)}
    80%{opacity:1}
    100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}
  }
</style>
</head>
<body>
<div class="app">
  <h1 class="sr">Choose your phone</h1>
  <div class="grid">
    <div class="col"><div class="track" id="col1"></div></div>
    <div class="col"><div class="track" id="col2"></div></div>
  </div>

  <div class="overlay" id="ov">
    <button class="close" id="close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="#111" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <div class="hero" id="hero"></div>

    <div class="picker">
      <div class="swatches" id="sw"></div>
      <div class="cname" id="cname"></div>
    </div>

    <div class="sheet">
      <div class="sel" id="sel"></div>
      <label for="f1">Full name</label>
      <input id="f1" placeholder="Your name" autocomplete="name">
      <label for="f2">Email</label>
      <input id="f2" type="email" placeholder="name@mail.com" autocomplete="email">
      <label for="f3">Delivery address</label>
      <input id="f3" placeholder="Street, city, postcode" autocomplete="street-address">
      <button class="next" id="next">Next</button>
    </div>

    <div class="stage">
      <div class="box" id="box">
        <svg viewBox="0 0 200 170">
          <ellipse cx="100" cy="162" rx="92" ry="7" fill="#000" opacity=".12"/>
          <path d="M14 46 L36 12 H164 L186 46Z" fill="#c99560"/>
          <rect x="14" y="44" width="172" height="116" rx="4" fill="#c58f58"/>
          <rect x="14" y="44" width="172" height="116" rx="4" fill="url(#boxg)"/>
          <rect x="92" y="12" width="16" height="70" fill="#e7c9a0"/>
          <g fill="#4a3220" font-family="Outfit,sans-serif" font-weight="700">
            <text x="100" y="112" text-anchor="middle" font-size="17" letter-spacing="2">FRAGILE</text>
            <text x="100" y="127" text-anchor="middle" font-size="6.5" letter-spacing="1.4">HANDLE WITH CARE</text>
          </g>
          <g stroke="#4a3220" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M30 96 h18 l-3 14 a6 6 0 0 1 -12 0z"/><path d="M39 116v12M32 128h14"/>
            <path d="M160 128V98M154 104l6-6 6 6M172 128V98M166 104l6-6 6 6"/>
          </g>
          <defs><linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient></defs>
        </svg>
      </div>

      <div class="circle" id="circle">
        <div class="road"></div>
        <svg class="truck" id="truck" viewBox="0 0 140 100">
          <g class="bob">
            <!-- cargo -->
            <rect x="12" y="38" width="30" height="22" rx="2" fill="#c58f58"/><rect x="24" y="38" width="6" height="22" fill="#e7c9a0"/>
            <rect x="44" y="40" width="26" height="20" rx="2" fill="#d19c64"/><rect x="54" y="40" width="6" height="20" fill="#e7c9a0"/>
            <rect x="20" y="18" width="26" height="20" rx="2" fill="#d19c64"/><rect x="30" y="18" width="6" height="20" fill="#e7c9a0"/>
            <rect x="26" y="0" width="20" height="18" rx="2" fill="#c58f58"/><rect x="33" y="0" width="6" height="18" fill="#e7c9a0"/>
            <!-- bed + cab -->
            <rect x="6" y="60" width="72" height="14" rx="3" fill="#5b8fe6"/>
            <path d="M78 74 V44 a6 6 0 0 1 6-6 h22 l16 18 h6 a6 6 0 0 1 6 6 v12z" fill="#4f84df"/>
            <path d="M86 44 h18 l11 12 H86z" fill="#cfe6ff"/>
            <rect x="122" y="62" width="8" height="5" rx="2" fill="#ffd36b"/>
          </g>
          <g class="wheel"><circle cx="30" cy="80" r="11" fill="#2b2b33"/><circle cx="30" cy="80" r="4.5" fill="#cfd3dc"/><rect x="29" y="70" width="2" height="6" fill="#cfd3dc"/></g>
          <g class="wheel"><circle cx="106" cy="80" r="11" fill="#2b2b33"/><circle cx="106" cy="80" r="4.5" fill="#cfd3dc"/><rect x="105" y="70" width="2" height="6" fill="#cfd3dc"/></g>
        </svg>
      </div>

      <div class="done-wrap">
        <div class="check" id="check">
          <svg width="64" height="64" viewBox="0 0 64 64"><path d="M14 33 l12 12 L50 20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="done-txt" id="doneTxt"><h2 id="dModel"></h2><p id="dColor"></p></div>
        <div class="confetti" id="conf"></div>
      </div>
    </div>
  </div>
</div>

  Black:'#1f1f22', Silver:'#e4e4e6', 'Sky Blue':'#bcd9e6', Burgundy:'#6b1530',

/* ---------- Phone SVG ---------- */
let uid = 0;
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=(n>>8&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function lens(x,y,r){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#1a1a1e"/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="#2c3140"/><circle cx="${x-r*.25}" cy="${y-r*.25}" r="${r*.2}" fill="#7f8aa6" opacity=".8"/>`;
}
function camera(type, col){
  const m = shade(col, -14), edge = shade(col, -40);
  switch(type){
    case 'pro': return `<rect x="34" y="40" width="50" height="50" rx="14" fill="${m}" stroke="${edge}" stroke-opacity=".35"/>
      ${lens(47,53,9.5)}${lens(47,77,9.5)}${lens(70,65,9.5)}<circle cx="72" cy="48" r="3.4" fill="#f6f1df"/><circle cx="72" cy="82" r="2" fill="#222"/>`;
    case 'diag': return `<rect x="34" y="40" width="42" height="42" rx="12" fill="${m}"/>${lens(46,52,7.5)}${lens(64,70,7.5)}<circle cx="66" cy="50" r="2.6" fill="#f6f1df"/>`;
    case 'pill': return `<rect x="36" y="40" width="22" height="44" rx="11" fill="${m}"/>${lens(47,51,7.5)}${lens(47,73,7.5)}<circle cx="66" cy="50" r="2.8" fill="#f6f1df"/>`;
    case 'vert': return `${lens(46,52,7.5)}${lens(46,72,7.5)}<circle cx="46" cy="88" r="2.6" fill="#f6f1df"/>`;
    case 'bar':  return `<rect x="30" y="40" width="80" height="22" rx="11" fill="${shade(col,-6)}"/>${lens(42,51,7)}<circle cx="58" cy="51" r="2.6" fill="#f6f1df"/><circle cx="66" cy="51" r="1.6" fill="#222"/>`;
  }
}
/* Real photos: add  photos:{ 'Black':'iphone-black.png', ... }  to a model (file path, URL or data: URI).
   Any color without a photo falls back to the drawn phone. */
function phoneSVG(model, colorName, wallIdx){
  const src = model.photos && (model.photos[colorName] || model.photos.default);
  if (src) return `<img class="photo" src="${src}" alt="${model.name} ${colorName}">`;
  const id = 'p'+(uid++), col = C[colorName], w = WALL[wallIdx % WALL.length];
  const light = shade(col, 28), dark = shade(col, -26);
  return `<svg viewBox="0 0 200 190" aria-label="${model.name} ${colorName}">
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
    <linearGradient id="${id}w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${w[0]}"/><stop offset=".4" stop-color="${w[1]}"/><stop offset=".75" stop-color="${w[2]}"/><stop offset="1" stop-color="${w[3]}"/></linearGradient>
    <radialGradient id="${id}s" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="${id}c"><rect x="98" y="16" width="78" height="160" rx="15"/></clipPath>
  </defs>
  <ellipse cx="100" cy="184" rx="78" ry="4" fill="#000" opacity=".08"/>
  <!-- front -->
  <rect x="94" y="12" width="86" height="168" rx="19" fill="${dark}"/>
  <rect x="96" y="14" width="82" height="164" rx="17" fill="#0c0c0e"/>
  <g clip-path="url(#${id}c)">
    <rect x="98" y="16" width="78" height="160" fill="url(#${id}w)"/>
    <path d="M98 120 C130 95 150 140 176 110 V176 H98z" fill="#000" opacity=".18"/>
    <path d="M98 70 C125 50 150 90 176 60 V16 H98z" fill="#fff" opacity=".12"/>
  </g>
  <rect x="124" y="21" width="26" height="7" rx="3.5" fill="#000"/>
  <text x="137" y="40" text-anchor="middle" font-family="Outfit,sans-serif" font-size="5" fill="#fff" opacity=".85">Tuesday, June 9</text>
  <text x="137" y="60" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="700" font-size="21" fill="#fff">9:41</text>
  <circle cx="108" cy="164" r="4.5" fill="#000" opacity=".35"/><circle cx="166" cy="164" r="4.5" fill="#000" opacity=".35"/>
  <rect x="124" y="171" width="26" height="2" rx="1" fill="#fff" opacity=".8"/>
  <!-- back -->
  <rect x="24" y="30" width="88" height="152" rx="20" fill="${dark}"/>
  <rect x="26" y="32" width="84" height="148" rx="18" fill="url(#${id}b)"/>
  <rect x="26" y="32" width="84" height="148" rx="18" fill="url(#${id}s)"/>
  <rect x="22" y="70" width="2.5" height="14" rx="1" fill="${dark}"/><rect x="22" y="90" width="2.5" height="18" rx="1" fill="${dark}"/>
  ${camera(model.cam, col)}
</svg>`;
}

/* ---------- Build grid ---------- */
const col1 = document.getElementById('col1'), col2 = document.getElementById('col2');
function card(i){
  const m = MODELS[i % MODELS.length];
  const color = m.colors[0];
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.m = m.name;
  el.innerHTML = phoneSVG(m, color, i) + `<b>${m.name}</b>`;
  el.onclick = () => openModel(m, i, color);
  return el;
}
[col1, col2].forEach((col, c) => {
  const set = [];
  const ORDER2 = [1, 0, 4, 5, 2, 3];   // right-column order: pairs line up one at a time
  for (let k = 0; k < MODELS.length; k++) set.push(c === 0 ? k : ORDER2[k]);
  [...set, ...set].forEach(i => col.appendChild(card(i)));   // duplicated for seamless loop
});

/* ---------- Overlay flow ---------- */
const ov = document.getElementById('ov'), hero = document.getElementById('hero'),
      sw = document.getElementById('sw'), cname = document.getElementById('cname'),
      sel = document.getElementById('sel'), next = document.getElementById('next'),
      inputs = [...document.querySelectorAll('.sheet input')];
let cur = null, curColor = null, curWall = 0, busy = false;

function setState(s){ ov.className = 'overlay open ' + s; }

function openModel(m, wall, color){
  cur = m; curWall = wall; curColor = color || m.colors[0];
  sw.innerHTML = '';
  m.colors.forEach(name => {
    const b = document.createElement('button');
    b.className = 'sw' + (name === curColor ? ' on' : '');
    b.style.background = `linear-gradient(135deg, ${shade(C[name],25)}, ${C[name]} 60%, ${shade(C[name],-20)})`;
    b.setAttribute('aria-label', name);
    b.onclick = () => { curColor = name; [...sw.querySelectorAll('.sw')].forEach(x=>x.classList.toggle('on', x===b)); paint(); };
    sw.appendChild(b);
  });
  const ok = document.createElement('button');
  ok.className = 'ok'; ok.setAttribute('aria-label','Confirm color');
  ok.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  ok.onclick = toForm;
  sw.appendChild(ok);
  hero.className = 'hero';
  paint();
  setScroll(false);
  setState('pick');
}
function paint(){
  hero.innerHTML = phoneSVG(cur, curColor, curWall);
  cname.textContent = curColor;
}
function toForm(){
  sel.textContent = `${cur.name} · ${curColor}`;
  setState('form');
  checkReady();
}
function closeAll(){
  if (busy || matching) return;
  ov.className = 'overlay';
  hero.classList.remove('golden');
  document.querySelectorAll('.card.gold').forEach(c => c.classList.remove('gold'));
  document.querySelectorAll('.link').forEach(l => l.remove());
  inputs.forEach(i => { i.value = ''; i.classList.remove('typing'); });
  next.classList.remove('pulse');
  checkReady();
  cooldownUntil = performance.now() + 2500;
  setScroll(true);
}
document.getElementById('close').onclick = closeAll;

function checkReady(){ next.classList.toggle('ready', inputs.every(i => i.value.trim())); }
inputs.forEach(i => i.addEventListener('input', checkReady));

/* ---------- Autofill: tap a field and it types itself ---------- */
const PROFILES = [
  ['Quillan Lunardi', 'lunardi.quillan@quillbox.net', '176 Quillstone Terrace, Eldenvale 93302'],
  ['Maren Holloway',  'maren.holloway@brightmail.com', '42 Linden Row, Ashford 20417'],
  ['Theo Varga',      'theo.varga@inboxly.net',        '9 Harbor Lane, Westbrook 77105'],
];
const profile = PROFILES[Math.floor(Math.random() * PROFILES.length)];
let typingNow = false;
inputs.forEach((inp, idx) => {
  inp.readOnly = true;                       // no keyboard pop-up on mobile
  inp.addEventListener('pointerdown', e => { e.preventDefault(); autoType(inp, profile[idx]); });
});
async function autoType(inp, text){
  if (typingNow || inp.value) return;
  typingNow = true;
  inputs.forEach(i => i.classList.remove('typing'));
  inp.classList.add('typing');
  for (const ch of text){
    if (!ov.classList.contains('form')) break;
    inp.value += ch;
    inp.scrollLeft = inp.scrollWidth;
    checkReady();
    await new Promise(r => setTimeout(r, 28 + Math.random() * 30));
  }
  typingNow = false;
  setTimeout(() => inp.classList.remove('typing'), 250);
}

/* ---------- Delivery sequence ---------- */
const box = document.getElementById('box'), circle = document.getElementById('circle'),
      truck = document.getElementById('truck'), check = document.getElementById('check'),
      doneTxt = document.getElementById('doneTxt'), conf = document.getElementById('conf');
const wait = ms => new Promise(r => setTimeout(r, ms));

next.onclick = async () => {
  if (busy || matching || typingNow) return; busy = true;
  next.classList.remove('pulse');
  document.activeElement && document.activeElement.blur();
  setState('ship');                                  // sheet slides away, phone to center
  await wait(750);
  box.classList.add('show');                        // box pops in
  await wait(250);
  hero.classList.add('into-box');                   // phone drops into box
  await wait(900);
  box.classList.add('shrink');                      // box -> circle with truck
  circle.classList.add('show');
  await wait(250);
  truck.classList.remove('out'); truck.classList.add('in');
  await wait(1300);
  truck.classList.remove('in'); truck.classList.add('out');
  await wait(700);
  circle.classList.add('hide');
  setState('ship done');
  await wait(250);
  document.getElementById('dModel').textContent = cur.name;
  document.getElementById('dColor').textContent = curColor;
  check.classList.add('show'); doneTxt.classList.add('show');
  burst();
  await wait(2800);
  restart();                                        // back to the grid, look for a new model
};

function restart(){
  ov.className = 'overlay';
  setTimeout(() => {
    hero.className = 'hero';
    box.className = 'box'; circle.className = 'circle'; truck.setAttribute('class', 'truck');
    check.classList.remove('show'); doneTxt.classList.remove('show'); conf.innerHTML = '';
    inputs.forEach(i => { i.value = ''; i.classList.remove('typing'); });
    next.classList.remove('pulse'); checkReady();
    busy = false;
    cooldownUntil = performance.now() + 1200;
    setScroll(true);
  }, 400);
}

function burst(){
  conf.innerHTML = '';
  const cols = ['#90caf9','#42a5f5','#1565e0','#81c784','#bbdefb','#a5d6a7'];
  for (let i = 0; i < 46; i++){
    const p = document.createElement('i');
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 110;
    p.style.background = cols[i % cols.length];
    p.style.setProperty('--x', Math.cos(a) * d + 'px');
    p.style.setProperty('--y', Math.sin(a) * d + 40 + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.animationDelay = Math.random() * .15 + 's';
    conf.appendChild(p);
    requestAnimationFrame(() => p.classList.add('go'));
  }
}

/* ---------- Match: same phone left & right -> gold link -> merge -> form ---------- */
let matching = false, cooldownUntil = performance.now() + 1500;
const used = new Set();                              // models already picked: next match is a new one
const app = document.querySelector('.app');

function setScroll(on){
  document.querySelectorAll('.track').forEach(t => t.style.animationPlayState = on ? 'running' : 'paused');
}

function scan(){
  if (!matching && !busy && !ov.classList.contains('open') && performance.now() > cooldownUntil){
    const H = app.clientHeight, aTop = app.getBoundingClientRect().top;
    const vis = col => [...col.children].map(el => ({el, r: el.getBoundingClientRect()}))
      .filter(o => o.r.top - aTop > 10 && o.r.bottom - aTop < H - 10);
    const L = vis(col1), R = vis(col2);
    outer: for (const l of L) for (const r of R){
      if (l.el.dataset.m === r.el.dataset.m && !used.has(l.el.dataset.m) && Math.abs(l.r.top - r.r.top) < 6){
        runMatch(l.el, r.el); break outer;
      }
    }
  }
  requestAnimationFrame(scan);
}
requestAnimationFrame(scan);

function rel(r){ const a = app.getBoundingClientRect(); return {x:r.left-a.left, y:r.top-a.top, w:r.width, h:r.height}; }

async function runMatch(lc, rc){
  matching = true;
  setScroll(false);
  const m = MODELS.find(x => x.name === lc.dataset.m);
  if (used.size >= MODELS.length - 1) used.clear(); // all shown: start a new round
  used.add(m.name);
  cur = m; curColor = m.colors[0]; curWall = 0;

  // 1. gold outline + link between the two cards
  lc.classList.add('gold'); rc.classList.add('gold');
  const a = rel(lc.getBoundingClientRect()), b = rel(rc.getBoundingClientRect());
  const link = document.createElement('div');
  link.className = 'link';
  Object.assign(link.style, {left:(a.x + a.w - 10)+'px', width:(b.x - a.x - a.w + 20)+'px', top:(a.y + a.h/2 - 3)+'px'});
  app.appendChild(link);
  requestAnimationFrame(() => link.classList.add('on'));
  await wait(1100);

  // 2. overlay in, hero parked (invisible) at its merge position
  hero.className = 'hero ghost golden';
  hero.innerHTML = phoneSVG(m, curColor, 0);
  setState('merge');
  const hr = rel(hero.getBoundingClientRect());
  const hcx = hr.x + hr.w/2, hcy = hr.y + hr.w*190/200/2;

  // 3. clones fly to the centre and grow
  const clones = [lc, rc].map((c, k) => {
    const cr = rel(c.getBoundingClientRect()), ir = rel(c.querySelector('.photo, svg').getBoundingClientRect());
    const cl = c.cloneNode(true);
    cl.classList.add('clone');
    Object.assign(cl.style, {left:cr.x+'px', top:cr.y+'px', width:cr.w+'px', height:cr.h+'px',
      transformOrigin:`${ir.x - cr.x + ir.w/2}px ${ir.y - cr.y + ir.h/2}px`});
    app.appendChild(cl);
    return {cl, icx: ir.x + ir.w/2, icy: ir.y + ir.h/2, s: hr.w / ir.w, side: k ? 1 : -1};
  });
  link.remove();
  lc.classList.remove('gold'); rc.classList.remove('gold');
  await wait(30);
  clones.forEach(o => {
    o.cl.classList.add('bare');
    o.cl.animate([
      {transform:'translate(0,0) scale(1)'},
      {transform:`translate(${hcx - o.icx + o.side*hr.w*.32}px, ${hcy - o.icy}px) scale(${o.s*.82}) rotate(${o.side*-6}deg)`, offset:.65},
      {transform:`translate(${hcx - o.icx}px, ${hcy - o.icy}px) scale(${o.s}) rotate(0deg)`}
    ], {duration:1150, easing:'cubic-bezier(.45,0,.25,1)', fill:'forwards'});
  });
  await wait(1080);

  // 4. two become one: gold flash, single phone remains
  const fl = document.createElement('div');
  fl.className = 'flash'; fl.style.left = hcx+'px'; fl.style.top = hcy+'px';
  app.appendChild(fl);
  hero.classList.remove('ghost');
  clones.forEach(o => o.cl.remove());
  setTimeout(() => fl.remove(), 900);
  await wait(900);

  // 5. form slides in and fills itself
  sel.textContent = `${m.name} · ${curColor}`;
  setState('form');
  await wait(650);
  matching = false;
  for (let i = 0; i < inputs.length; i++){
    if (!ov.classList.contains('form')) return;      // closed meanwhile
    await autoType(inputs[i], profile[i]);
    await wait(280);
  }
  checkReady();
  if (next.classList.contains('ready')) next.classList.add('pulse');
}
</script>
